<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Agenda Vital</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Agenda">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: una columna tipo app móvil, 5 pestañas con barra inferior fija; siempre en oscuro */
:root{
  --bg:#000000; --card:#121317; --card2:#1D1F25; --line:#2A2D35;
  --fg:#F2F3F5; --muted:#9AA0AC; --accent:#F5C451; --on-accent:#141210;
  --ok:#A3E06B; --info:#6EA8FF; --warn:#FF8A5B; --pink:#FF8FC7;
  --font:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;margin:0}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(20px + env(safe-area-inset-top,0px)) 150px;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:4px 0 0;font-size:28px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:17px;font-weight:800}
p{margin:0}
.card{background:var(--card);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{min-height:44px;border:none;border-radius:12px;padding:0 16px;background:var(--accent);color:var(--on-accent);font-weight:700}
.btn.ghost{background:var(--card2);color:var(--fg)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:44px;height:44px;flex:none;border-radius:12px;border:none;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.icon svg{width:22px;height:22px}
input,select{min-height:44px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:0 12px;width:100%;min-width:0}
textarea{width:100%;min-height:110px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;color:var(--fg)}
textarea.mono{font:12px/1.4 ui-monospace,monospace}
label.lbl{display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wide{grid-column:1/-1}
details.add{background:var(--card);border-radius:18px;padding:0 16px}
details.add summary{min-height:52px;display:flex;align-items:center;justify-content:space-between;font-weight:800;cursor:pointer;list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add summary::after{content:"+";font-size:22px;color:var(--accent)}
details.add[open] summary::after{content:"−"}
details.add form{display:flex;flex-direction:column;gap:10px;padding-bottom:16px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water span{width:24px;height:30px;border-radius:6px 6px 9px 9px;border:2px solid var(--info);opacity:.45}
.water span.on{background:var(--info);opacity:1}
.item{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{font-weight:700;overflow-wrap:anywhere}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.check{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid var(--muted);background:transparent;display:flex;align-items:center;justify-content:center;color:var(--on-accent);font-weight:800}
.check.on{background:var(--ok);border-color:var(--ok)}
.pill{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;white-space:nowrap}
.pill.must{background:var(--warn);color:var(--on-accent)}
.pill.late{border:1px solid var(--warn);color:var(--warn)}
.pill.soft{background:var(--card2);color:var(--muted)}
.pill.okp{background:var(--ok);color:var(--on-accent)}
.del{border:none;background:transparent;color:var(--muted);min-width:36px;min-height:36px;border-radius:10px;font-size:13px;font-weight:700;flex:none}
.del.confirm{background:var(--warn);color:var(--on-accent);padding:0 8px}
.amount{font-weight:800;white-space:nowrap}
.pos{color:var(--ok)} .neg{color:var(--warn)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-size:18px}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;overflow-x:auto}
.seg button{flex:1 0 auto;min-height:40px;border:none;border-radius:9px;background:transparent;font-weight:700;color:var(--muted);padding:0 12px}
.seg button.on{background:var(--card);color:var(--fg)}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.banner{background:var(--card2);border:1px dashed var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.preview{border:1px dashed var(--accent);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:none;border-radius:18px;padding:16px;min-height:96px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:10px;text-align:left}
.tile svg{width:24px;height:24px;color:var(--accent)}
.tile b{font-size:15px}
.tile span{font-size:12px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0}
.cal button{min-height:46px;border:none;border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:14px}
.cal button.out{background:transparent;color:var(--muted);opacity:.5}
.cal button.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal button.sel{background:var(--accent);color:var(--on-accent)}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.spark{width:100%;height:40px}
.aibar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 16px;width:100%;text-align:left;color:var(--muted)}
.aibar span{flex:1}
[hidden]{display:none!important}
.empty{display:flex;align-items:center;gap:10px}.eico{width:28px;height:28px;color:var(--muted);flex:none;opacity:.8}.eico svg{width:100%;height:100%}
@media (prefers-reduced-motion:no-preference){.anim>*{animation:enter .28s cubic-bezier(.2,.7,.2,1) both}.anim>*:nth-child(2){animation-delay:.03s}.anim>*:nth-child(3){animation-delay:.06s}.anim>*:nth-child(4){animation-delay:.09s}.anim>*:nth-child(n+5){animation-delay:.12s}}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toggles{display:flex;flex-direction:column;gap:10px}.tog{display:flex;gap:12px;align-items:center;font-size:14px}.tog input{width:22px!important;height:22px;min-height:0!important;flex:none;accent-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px}.optcard{background:var(--card2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.srcs{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.srcs a{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chips .chip{flex:none}
.chart,.card>svg.chart{width:100%;height:auto;display:block;flex:none}
.optcard .btn.ghost{background:var(--card)}
.wl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;line-height:1.45}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px))}
.lockbox{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:300px}
.pindots{display:flex;gap:14px}.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}.pindots i.on{background:var(--accent);border-color:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pinpad button{width:72px;height:72px;border-radius:50%;border:none;background:var(--card2);font-size:26px;font-weight:700}
.folders{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.folder{position:relative;border:none;background:transparent;padding:16px 0 0;text-align:left;color:var(--fg);min-width:0}
.ftab{position:absolute;top:0;left:0;width:46%;height:24px;border-radius:12px 12px 0 0;background:var(--fc)}
.fbody{display:flex;flex-direction:column;gap:5px;background:color-mix(in srgb,var(--fc) 20%,var(--card));border-top:4px solid var(--fc);border-radius:0 16px 16px 16px;padding:14px;min-height:136px}
.fbody b{font-size:17px;overflow-wrap:anywhere}
.finit{width:38px;height:38px;border-radius:11px;background:var(--fc);color:#111;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center}
.fmeta{font-size:12px;font-weight:700;color:var(--fc);margin-top:auto}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.swatch.on{border-color:var(--fg)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.filebtn{display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer}
.ringbox{position:relative;width:124px;height:124px;flex:none}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font-size:26px}.ringtxt span{font-size:11px;color:var(--muted)}
.macros{display:flex;gap:10px;font-size:12px;font-weight:700}.macros i{font-style:normal}
.donutwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut{width:140px;height:140px;flex:none}
.legend2{flex:1;min-width:160px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.catdot{width:28px;height:28px;border-radius:9px;color:#111;font-weight:800;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.catbtn{border:1px solid var(--line);background:var(--card2);border-radius:14px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;padding:6px 2px}
.catbtn span:last-child{overflow:hidden;text-overflow:ellipsis;max-width:100%;white-space:nowrap}
.bigamt{font-size:30px!important;font-weight:800;text-align:center;min-height:60px!important}
.dayhead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);text-transform:capitalize;padding:10px 0 2px;border-bottom:1px solid var(--line)}
.cal14{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;height:90px}
.d14{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.d14b{flex:1;width:100%;display:flex;align-items:flex-end;background:var(--card2);border-radius:4px;overflow:hidden}
.d14b i{display:block;width:100%}
.d14 span{font-size:10px;color:var(--muted)}
.sign{width:150px;height:150px;align-self:center;display:block;flex:none}
.sign svg{width:100%;height:100%}
.exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.extile{position:relative;background:var(--card2);border-radius:16px;min-width:0}
.exmain{width:100%;border:none;background:transparent;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--fg);border-radius:16px}
.exmain b{font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.expic{width:84px;height:84px;color:var(--accent);display:block;flex:none}
.expic svg{width:100%;height:100%}
.exdel{position:absolute;top:4px;right:4px}
.exbest{position:absolute;top:8px;left:8px;font-size:10px}
html{touch-action:manipulation;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
input,select,textarea,textarea.mono{font-size:16px!important}
.aibar input{flex:1;min-width:0;border:none;background:transparent;min-height:36px;padding:0;color:var(--fg)}
.aiico{width:36px;height:36px;flex:none;border:none;background:transparent;color:var(--accent);display:flex;align-items:center;justify-content:center;padding:0}
.aisend{width:36px;height:36px;flex:none;border:none;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:18px;font-weight:800}
nav .plus span{width:50px;height:50px;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
.chip{min-height:40px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:0 14px;font-weight:700;font-size:13px}
.chip.on{background:var(--ok);color:var(--on-accent);border-color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal form{width:100%;max-width:520px;max-height:85vh;overflow:auto;border:1px solid var(--line)}
.linkbtn{border:none;background:none;padding:0;color:var(--fg);font:inherit;font-weight:800;text-align:left;display:flex;align-items:center;gap:6px;min-height:36px}
.dockrow{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.fab{width:52px;height:52px;flex:none;border:none;border-radius:16px;background:var(--accent);color:var(--on-accent);font-size:28px;font-weight:700;line-height:1}
.sheet{max-width:520px;margin:0 auto 10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet button{min-height:64px;border:none;border-radius:12px;background:var(--card2);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.sheet svg,.card>svg{width:22px;height:22px;flex:none}
.sheet svg{color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.aidock{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom,0px));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.aidock .aibar{max-width:520px;margin:0 auto;min-height:44px;padding:4px 4px 4px 14px;border-color:var(--accent)}
.aidock .aibar svg{width:20px;height:20px;color:var(--accent)}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.45}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.msg.ai{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.opt{min-height:48px;border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;text-align:left;font-weight:600}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card2))}
.opt.wrong{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 20%,var(--card2))}
.switch{width:52px;height:32px;flex:none;border-radius:16px;border:none;background:var(--card2);position:relative}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--muted)}
.switch.on{background:var(--accent)}
.switch.on::after{left:24px;background:var(--on-accent)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px max(6px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(6,minmax(0,1fr));z-index:5}
nav button{min-height:52px;border:none;background:transparent;color:var(--muted);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav button.on{color:var(--accent)}
nav svg{width:22px;height:22px}
@media (prefers-reduced-motion:no-preference){.check,.water span,.switch::after{transition:all .15s}}
</style>
</head>
<body>

<div class="app" id="app"></div>
<div id="lock" hidden></div>
<div id="modal"></div>
<div id="toast" class="toast" role="status" hidden></div>
<div class="aidock" id="aidock"></div>
<nav id="nav" aria-label="Secciones"></nav>

<script>
const KEY='agendaVital.v1';
const CATS=['Comida','Transporte','Gimnasio','Ocio','Ropa','Casa','Salud','Suscripciones','Regalos','Clases','Deudas','Ahorro','Otros'];
const INCATS=['Clases','Nómina','Regalos','Ventas','Deudas','Otros'];
const ALLCATS=[...new Set([...CATS,...INCATS])];
const CATCOL={Comida:'#F5C451',Transporte:'#6EA8FF',Gimnasio:'#A3E06B',Ocio:'#C9A2FF',Ropa:'#FF8FC7',Casa:'#FFB86B',Salud:'#5FD3C6',Suscripciones:'#9AA7FF',Regalos:'#FF8A5B',Clases:'#E8E8E8',Deudas:'#B0B4BE',Ahorro:'#7BE0A0',Nómina:'#A3E06B',Ventas:'#5FD3C6',Otros:'#8A8F99'};
const catCol=c=>CATCOL[c]||'#8A8F99';
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=ymd(new Date());
const addDays=(n,base)=>{const d=base?parseD(base):new Date();d.setDate(d.getDate()+n);return ymd(d)};
const parseD=s=>{const[y,m,d]=s.split('-');return new Date(y,m-1,d)};
const uid=()=>Math.random().toString(36).slice(2,10);
const eur=n=>(Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:0,maximumFractionDigits:2})+' €';
const fdate=s=>{if(!s)return'Sin fecha';if(s===TODAY)return'Hoy';if(s===addDays(1))return'Mañana';if(s===addDays(-1))return'Ayer';return parseD(s).toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const mins=t=>{const[h,m]=(t||'0:0').split(':');return(+h)*60+(+m)};
const hm=m=>Math.floor(m/60)+' h '+pad(Math.round(m%60))+' min';

async function apiPost(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json','x-app-token':appToken()},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok){const e=new Error(d.error||('http '+r.status));e.status=r.status;throw e}return d}
const hsh=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return(h>>>0).toString(36)};

const PUSH_TYPES=[['carnet','Tests del carnet pendientes (20:00)'],['agua','Agua si vas corto (13:00 y 18:00)'],['plan','Entreno que toca (09:30)'],['tareas','Tareas, citas y trámites'],['clases','Clases (30 min antes)'],['equipo','Entrenos y partidos (1 h antes)'],['cumples','Cumpleaños (el día antes y el mismo día)'],['deudas','Deudas de más de una semana (lunes)'],['semana','Resumen del domingo (20:00)']];
const pushSt=()=>S.push||(S.push={enabled:false,sub:null,map:{},prefs:{}});
const pushOn=k=>(pushSt().prefs||{})[k]!==false;
const isStandalone=()=>{try{return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const pushSupported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const atTime=(d,hhmm)=>{const[h,m]=String(hhmm).split(':').map(Number),x=parseD(d);x.setHours(h||0,m||0,0,0);return x.getTime()};
function desiredReminders(){const out=[],now=Date.now(),lim=now+6.5*864e5,add=(key,at,title,body,url)=>{if(at>now+60000&&at<lim)out.push({key,at,title,body:body||'',url:url||'/'})};
  const days=Array.from({length:8},(_,i)=>addDays(i));
  for(const d of days){const today=d===TODAY;
    if(pushOn('carnet')&&(!today||testsDone()<TESTS_DAY))add('carnet-'+d,atTime(d,'20:00'),'Tests del carnet',today?`Llevas ${testsDone()} de ${TESTS_DAY}. ¡Que no se te pase!`:`Recuerda hacer tus ${TESTS_DAY} tests de hoy.`,'/?go=carnet');
    if(pushOn('agua')){const w=today?(S.water[d]||0):0;if(w<S.goals.water*0.5)add('agua1-'+d,atTime(d,'13:00'),'Agua',today?`Llevas ${w} de ${S.goals.water} vasos.`:'¿Cómo vas de agua hoy?','/');if(w<S.goals.water*0.8)add('agua2-'+d,atTime(d,'18:00'),'Agua',today?`Llevas ${w} de ${S.goals.water} vasos. Aún estás a tiempo.`:'Revisa cuánta agua llevas hoy.','/')}
    if(pushOn('plan')){const code=(S.plan||[])[parseD(d).getDay()]||'';if(code){const[k,v]=code.split(':'),name=k==='rt'?v:(RTYPES[v]?RTYPES[v][0]:v);add('plan-'+d,atTime(d,'09:30'),'Hoy toca '+name,k==='rt'?'Día de gimnasio.':'Toca running.','/')}}
    if(pushOn('cumples'))S.bdays.forEach(b=>{if(b.date.slice(5)===d.slice(5)){add('cum0-'+b.id+d,atTime(d,'09:00'),'Hoy es el cumple de '+b.name,'No te olvides de felicitarle.','/?go=cumples');add('cum1-'+b.id+d,atTime(d,'20:00')-864e5,'Mañana es el cumple de '+b.name,'','/?go=cumples')}});
  }
  if(pushOn('tareas')){S.tasks.filter(t=>!t.done&&t.date&&t.date>=TODAY).forEach(t=>add('task-'+t.id+'-'+t.date+(t.time||''),t.time?atTime(t.date,t.time)-36e5:atTime(t.date,'09:00'),(t.must?'Obligatorio: ':'')+t.title,t.time?'En 1 hora ('+t.time+')':(t.kind==='Cita'?'Hoy tienes esta cita.':'Para hoy.'),'/?go=tareas'));
    S.tasks.filter(t=>!t.done&&t.must&&t.date&&t.date<TODAY).forEach(t=>add('late-'+t.id+'-'+addDays(1),atTime(addDays(1),'10:00'),'Sigue pendiente: '+t.title,'Es obligatorio y está atrasado.','/?go=tareas'))}
  if(pushOn('clases'))S.lessons.filter(l=>l.time&&l.date>=TODAY).forEach(l=>add('les-'+l.id+'-'+l.date+l.time,atTime(l.date,l.time)-18e5,'Clase con '+stu(l.sid).name,'En 30 minutos'+(l.topic?' · '+l.topic:''),'/?go=clases'));
  if(pushOn('equipo'))S.events.filter(e=>e.time&&e.date>=TODAY).forEach(e=>add('ev-'+e.id+'-'+e.date+e.time,atTime(e.date,e.time)-36e5,(e.who==='Yo'?'Tu partido':e.type+' del nacional')+' en 1 hora',e.where||'','/?go=agenda'));
  if(pushOn('deudas')){const old=S.debts.filter(x=>!x.paid&&x.dir==='meDeben'&&x.date<=addDays(-7));const mon=days.find(d=>parseD(d).getDay()===1);if(old.length&&mon)add('deu-'+mon,atTime(mon,'10:00'),'Te deben dinero',old.slice(0,3).map(x=>x.person+' '+eur(x.amount)).join(', ')+(old.length>3?'…':''),'/?go=deudas')}
  if(pushOn('semana')){const sun=days.find(d=>parseD(d).getDay()===0);if(sun)add('sem-'+sun,atTime(sun,'20:00'),'Tu resumen de la semana','Mira cómo te ha ido y los consejos para la próxima.','/?go=semana')}
  return out.sort((a,b)=>a.at-b.at).slice(0,60)}
let pushTimer=null,pushBusy=false;
function schedulePushSync(){try{if(!pushSt().enabled)return}catch(e){return}clearTimeout(pushTimer);pushTimer=setTimeout(()=>syncPush().catch(()=>{}),4000)}
async function syncPush(){const P=pushSt();if(!P.enabled||!P.sub||pushBusy||!navigator.onLine)return;pushBusy=true;try{
  const want=desiredReminders(),wantK=new Map(want.map(w=>[w.key,w])),map=P.map||(P.map={}),now=Date.now(),cancel=[],add=[];
  for(const[k,v]of Object.entries(map)){const w=wantK.get(k);if(v.at<now-6e4){delete map[k];continue}if(!w||w.at!==v.at||hsh(w.title+w.body)!==v.h)cancel.push([k,v.id])}
  for(const w of want){const m=map[w.key];if(!m||cancel.some(c=>c[0]===w.key))add.push(w)}
  if(!cancel.length&&!add.length)return;
  const r=await apiPost('/api/push',{action:'sync',sub:P.sub,add,cancel:cancel.map(c=>c[1])});
  for(const[k]of cancel)delete map[k];
  for(const w of add)if(r.added&&r.added[w.key])map[w.key]={id:r.added[w.key],at:w.at,h:hsh(w.title+w.body)};
  P.lastSync=Date.now();saveRaw()}catch(e){if(e.status===410){P.enabled=false;P.map={};saveRaw()}}finally{pushBusy=false}}
function b64u8(b){const p='='.repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(s,c=>c.charCodeAt(0))}
async function enablePush(){const msg=t=>{const el=document.getElementById('pushMsg');if(el)el.textContent=t};
  if(!pushSupported()||!isStandalone())return msg(isStandalone()?'Este iPhone no permite avisos web: actualiza iOS.':'Primero instala la app (Compartir → Añadir a pantalla de inicio) y ábrela desde el icono.');
  try{const perm=await Notification.requestPermission();if(perm!=='granted')return msg('Has rechazado los avisos. Actívalos en Ajustes del iPhone → Notificaciones → Agenda.');
    const k=await fetch('/api/push').then(r=>r.json());if(!k.publicKey||!k.ready)return msg('Faltan claves en Vercel. Abre /api/setup para ver cuáles.');
    const reg=await navigator.serviceWorker.ready;let sub=await reg.pushManager.getSubscription();if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(k.publicKey)});
    const P=pushSt();P.enabled=true;P.sub=sub.toJSON();P.map={};P.prefs=P.prefs||{};saveRaw();render();
    await apiPost('/api/push',{action:'test',sub:P.sub});showToast('Avisos activados. Te he mandado uno de prueba.',3500);await syncPush();render()}
  catch(e){msg(e.status===401?'La clave de la app no coincide (Ajustes → Asistente).':'No se han podido activar ('+(e.message||e)+').')}}
async function disablePush(){const P=pushSt(),ids=Object.values(P.map||{}).map(v=>v.id);try{if(ids.length&&P.sub)await apiPost('/api/push',{action:'sync',sub:P.sub,add:[],cancel:ids})}catch(e){}
  try{const reg=await navigator.serviceWorker.ready,s=await reg.pushManager.getSubscription();if(s)await s.unsubscribe()}catch(e){}P.enabled=false;P.map={};P.sub=null;saveRaw();render();showToast('Avisos desactivados')}
function pushCard(){const P=pushSt(),n=Object.keys(P.map||{}).length;
  return `<section class="card"><div class="row between"><h2>Avisos</h2>${P.enabled?'<span class="pill okp">Activados</span>':''}</div>
   <p class="muted">${P.enabled?`${n} aviso${n===1?'':'s'} programado${n===1?'':'s'} para los próximos días. Se actualizan solos cuando apuntas o terminas algo.`:isStandalone()?'Te aviso de los tests, el agua, cumpleaños, citas, clases y más.':'Para recibir avisos, abre la app desde el icono de la pantalla de inicio.'}</p>
   <div class="toggles">${PUSH_TYPES.map(([k,l])=>`<label class="tog" for="pt_${k}"><input id="pt_${k}" type="checkbox" data-pref="${k}" ${pushOn(k)?'checked':''}><span>${l}</span></label>`).join('')}</div>
   ${P.enabled?`<div class="row"><button class="btn ghost" style="flex:1" data-act="pushTest">Enviar prueba</button><button class="btn ghost" data-act="pushOff">Desactivar</button></div>`:`<button class="btn" data-act="pushOn">Activar avisos</button>`}<span class="muted" id="pushMsg" role="status"></span></section>`}

let shopBusy=null;
async function shopSearch(id){const w=find('wish',id);if(!w||shopBusy)return;shopBusy=id;render();
  try{const d=await apiPost('/api/ai',{mode:'shop',item:{name:w.item,max:w.price,pref:w.pref}}),data=d.data||{};
    w.options=(Array.isArray(data.options)?data.options:[]).slice(0,4).map(o=>({name:String(o.name||'').slice(0,120),price:Math.round((+o.price||0)*100)/100,store:String(o.store||'').slice(0,60),why:String(o.why||'').slice(0,200),url:safeUrl(o.url)}));
    w.tip=String(data.tip||'').slice(0,240);w.sources=(data.sources||[]).map(s=>({title:String(s.title||'').slice(0,80),url:safeUrl(s.url)})).filter(s=>s.url);w.searchedAt=TODAY;
    if(!w.options.length)showToast('No he encontrado opciones claras. Prueba a detallar más lo que quieres.',3800)}
  catch(e){showToast(aiErr(e.status),3800)}shopBusy=null;save();render()}
async function shopWatch(id){const w=find('wish',id),P=pushSt();if(!w)return;
  try{if(w.watchId){await apiPost('/api/push',{action:'unwatch',sub:P.sub||{endpoint:'-'},scheduleId:w.watchId});w.watchId='';showToast('Ya no vigilo el precio')}

const weekKey=()=>addDays(-((new Date().getDay()+6)%7));
function weekData(){const from=addDays(-6),inR=d=>d>=from&&d<=TODAY,days7=Array.from({length:7},(_,i)=>addDays(i-6)),dur=s=>(mins(s.up)-mins(s.bed)+1440)%1440;
  const g=S.gym.filter(x=>inR(x.date)),runs=S.runs.filter(x=>inR(x.date)),meals=S.meals.filter(x=>inR(x.date)),md=[...new Set(meals.map(m=>m.date))].length,sl=S.sleep.filter(x=>inR(x.date)),mv=S.moves.filter(x=>inR(x.date)),ct=ctList().filter(x=>inR(x.date));
  return{desde:from,hasta:TODAY,
    gimnasio:{dias:new Set(g.map(x=>x.date)).size,ejercicios:[...new Set(g.map(x=>x.ex))].slice(0,12),records:[...new Set(g.map(x=>x.ex))].filter(ex=>{const all=S.gym.filter(y=>y.ex===ex),best=Math.max(...all.map(y=>y.kg));return all.length>1&&g.some(y=>y.ex===ex&&y.kg===best)})},
    running:{sesiones:runs.length,km:Math.round(sum(runs,r=>r.km||0)*10)/10,objetivoKmSemana:S.goals.km,tipos:runs.map(r=>rType(r))},
    comida:{diasApuntados:md,kcalMediaDia:md?Math.round(sum(meals,m=>+m.kcal||0)/md):null,objetivoKcal:S.goals.kcal,proteinaMediaDia:md?Math.round(sum(meals,m=>+m.p||0)/md):null,objetivoProteina:S.goals.prot},
    sueno:{noches:sl.length,mediaHoras:sl.length?Math.round(sum(sl,dur)/sl.length/6)/10:null},
    agua:{mediaVasos:Math.round(sum(days7,d=>S.water[d]||0)/7*10)/10,objetivo:S.goals.water},
    dinero:{gastado:Math.round(sum(mv.filter(m=>m.type==='gasto'),m=>m.amount)),ingresado:Math.round(sum(mv.filter(m=>m.type==='ingreso'),m=>m.amount)),porCategoria:CATS.map(c=>[c,Math.round(sum(mv.filter(m=>m.type==='gasto'&&m.cat===c),m=>m.amount))]).filter(x=>x[1]>0)},
    carnet:{tests:ct.length,objetivo:TESTS_DAY*7,diasCompletos:days7.filter(d=>testsOn(d).length>=TESTS_DAY).length,mediaFallos:ct.length?Math.round(sum(ct,t=>t.fails)/ct.length*10)/10:null},

const TEST_N=30,TESTS_DAY=10,MAX_FAILS=3;

function updStreak(){const c=S.carnet;if(testsDone()>=TESTS_DAY&&c.last!==TODAY){c.streak=c.last===addDays(-1)?c.streak+1:1;c.last=TODAY}}
function addCTest(fails,date){const d=date||TODAY;ctList().push({id:uid(),fails:Math.max(0,Math.min(TEST_N,Math.round(+fails||0))),date:d});if(d===TODAY)updStreak()}
function vCarnet(){const c=S.carnet,td=testsDone(),today=testsOn(TODAY),all=ctList();

  `<section class="card"><div class="row between"><h2>Hoy</h2><span class="num amount">${td} de ${TESTS_DAY}</span></div><div class="bar"><i style="width:${Math.min(100,td/TESTS_DAY*100)}%"></i></div>

function render(){const appEl=document.getElementById('app'),vk=[tab,sub.agenda,sub.cuerpo,sub.dinero,sub.mas,selStu,selRt,selEx,selRun].join('|');appEl.innerHTML=({hoy:viewHoy,agenda:viewAgenda,cuerpo:viewCuerpo,personas:viewClases,dinero:vDinero,mas:viewMas})[tab]();renderNav();renderDock();document.getElementById('modal').innerHTML=(S.example&&!onboarded())?onboardHTML():editModal();renderLock();if(vk!==lastVK){appEl.classList.remove('anim');void appEl.offsetWidth;appEl.classList.add('anim');lastVK=vk}document.body.dataset.sec=tab==='cuerpo'?(sub.cuerpo==='run'?'run':'gym'):tab==='personas'?'clases':(tab==='mas'&&sub.mas==='dinero')?'dinero':'base';openForm=null;if(focusForm){focusForm=false;setTimeout(()=>{const el=document.querySelector('details.add[open] input:not([type=hidden]),#notes_text');if(el)el.focus()},0)}}
const clearExample=()=>{S=EMPTY()};
const find=(col,id)=>S[col].find(x=>x.id===id);

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id,v=b.dataset.v;
  if(a!=='del'&&a!=='wipe'&&a!=='rmEx')pendingDel=null;
  if(a!=='quick')quick=false;
  if(a==='tab'){tab=v;if(v==='cuerpo'){selRt=null;selEx=null;selRun=null}if(v==='mas')sub.mas='';if(v==='personas')selStu=null;quiz=null;window.scrollTo(0,0)}
  else if(a==='openStu'){selStu=id||null;window.scrollTo(0,0)}
  else if(a==='copySheet'){const sh=find('sheets',id),m=document.getElementById('cs_'+id);(navigator.clipboard?navigator.clipboard.writeText(sh.title+'\n\n'+sh.body):Promise.reject()).then(()=>m.textContent='Copiada.').catch(()=>m.textContent='No se pudo copiar. Mantén pulsado el texto para copiarlo.');return}
  else if(a==='sub'){sub[b.dataset.k]=v;quiz=null}
  else if(a==='go'){tab='mas';sub.mas=v;quiz=null;window.scrollTo(0,0)}
  else if(a==='water')S.water[TODAY]=Math.max(0,(S.water[TODAY]||0)+Number(v));
  else if(a==='toggleTask'){const t=find('tasks',id);if(t)t.done=!t.done}
  else if(a==='toggleWish'){const t=find('wish',id);if(t){t.done=!t.done;if(t.done&&t.watchId)shopWatch(id)}}
  else if(a==='toggleAlarm'){const t=find('alarms',id);if(t)t.on=!t.on}
  else if(a==='quick')quick=!quick;
  else if(a==='q'){if(v==='water'){S.water[TODAY]=(S.water[TODAY]||0)+1;save();render();showToast('Vaso apuntado · '+S.water[TODAY]+' de '+S.goals.water);return}
    const go={move:()=>{tab='mas';sub.mas='dinero';sub.dinero='movs';openForm='moves'},debt:()=>{tab='mas';sub.mas='dinero';sub.dinero='deudas';openForm='debts'},gym:()=>{tab='cuerpo';sub.cuerpo='gym';openForm='gym'},task:()=>{tab='agenda';sub.agenda='tareas';openForm='tasks'},note:()=>{tab='mas';sub.mas='notas'}}[v];if(go)go();focusForm=true;quiz=null;window.scrollTo(0,0)}
  else if(a==='bkFile'){S.lastBackup=TODAY;save();shareFile('agenda-vital-'+TODAY+'.json','application/json',JSON.stringify(S));render();return}
  else if(a==='pushOn'){enablePush();return}
  else if(a==='pushOff'){disablePush();return}
  else if(a==='pushTest'){const P=pushSt();apiPost('/api/push',{action:'test',sub:P.sub}).then(()=>showToast('Aviso de prueba enviado')).catch(e=>showToast('No se ha podido ('+(e.message||e)+').',3500));return}
  else if(a==='shopSearch'){shopSearch(id);return}
  else if(a==='shopWatch'){shopWatch(id);return}
  else if(a==='weekGen'){genWeekly();return}
  else if(a==='statEx')statEx=v;
  else if(a==='unlockBio'){unlockBio();return}
  else if(a==='bioOn'){setupBio();return}
  else if(a==='lockOff'){setLock(null);locked=false;showToast('Bloqueo quitado')}
  else if(a==='pin'){const c=lockCfg();if(v==='⌫')pinBuf=pinBuf.slice(0,-1);else if(pinBuf.length<4)pinBuf+=v;
    if(pinBuf.length===4&&c){const try_=pinBuf;sha(try_).then(h=>{if(h===c.pin){locked=false;pinBuf=''}else{pinBuf=''}renderLock();if(locked){const m=document.getElementById('lockMsg');if(m)m.textContent='PIN incorrecto'}})}renderLock();return}
  else if(a==='stuColor'){const st=find('students',id);if(st)st.color=v}
  else if(a==='foodDay'){const n=addDays(+v,foodDay);foodDay=n>TODAY?TODAY:n}
  else if(a==='foodCancel')foodDraft=null;
  else if(a==='foodFocus'){const el=document.getElementById('foodTxt');if(el)el.focus();return}
  else if(a==='mMonth'){const n=ymAdd(moneyMonth,+v);if(n<=TODAY.slice(0,7))moneyMonth=n}
  else if(a==='qType')qType=v;
  else if(a==='mdCancel')moneyDraft=null;
  else if(a==='csv'){const rows=[['Fecha','Tipo','Concepto','Categoría','Importe'],...movesOf(moneyMonth).sort((x,y)=>x.date>y.date?1:-1).map(m=>[m.date,m.type,m.concept,m.cat,(m.type==='gasto'?-m.amount:m.amount).toFixed(2).replace('.',',')])];
    shareFile('movimientos-'+moneyMonth+'.csv','text/csv','﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n'));return}
  else if(a==='ctStep'){const el=document.getElementById('ctFails');if(el)el.value=Math.max(0,Math.min(TEST_N,(+el.value||0)+(+v)));return}
  else if(a==='undo'){if(lastUndo){S=JSON.parse(lastUndo);lastUndo=null;chat.push({ai:'Deshecho.'})}}
  else if(a==='aiEx'){const el=document.getElementById('aiIn');if(el){el.value=v;el.focus()}return}
  else if(a==='edit'){editing={k:b.dataset.k,id};render();setTimeout(()=>{const el=document.querySelector('.modal input,.modal select,.modal textarea');if(el)el.focus()},0);return}
  else if(a==='closeEdit')editing=null;
  else if(a==='habit'){const l=S.habitLog[TODAY]=S.habitLog[TODAY]||[],i=l.indexOf(id);if(i<0)l.push(id);else l.splice(i,1)}
  else if(a==='painOk'){const p=find('pains',id);if(p)p.resolved=TODAY}
  else if(a==='favMeal'){const m=find('meals',id);if(m&&!S.mealFav.some(f=>f.what===m.what))S.mealFav.push({id:uid(),when:m.when,what:m.what,kcal:m.kcal,p:m.p||0,c:m.c||0,f:m.f||0});save();render();showToast('Guardada en «Lo de siempre»');return}
  else if(a==='eatFav'){const f=find('mealFav',id);if(f)S.meals.push({id:uid(),when:momentNow(),what:f.what,kcal:f.kcal,p:f.p||0,c:f.c||0,f:f.f||0,date:sub.cuerpo==='comidas'?foodDay:TODAY});save();render();if(f)showToast('Apuntado: '+f.what);return}
  else if(a==='goRt'){tab='cuerpo';sub.cuerpo='gym';selRt=id;selEx=null;window.scrollTo(0,0)}
  else if(a==='goRun'){tab='cuerpo';sub.cuerpo='run';selRun=v;window.scrollTo(0,0)}
  else if(a==='openRun'){selRun=v||null;window.scrollTo(0,0)}
  else if(a==='openRt'){selRt=id||null;selEx=null;window.scrollTo(0,0)}
  else if(a==='rmEx'){const k='rtex'+v;if(pendingDel===k){const r=find('routines',id);if(r)r.exs.splice(+v,1);pendingDel=null}else{pendingDel=k;render();return}}
  else if(a==='openEx'){selEx=v||null;window.scrollTo(0,0)}
  else if(a==='weekNav')weekStart=addDays(+v,weekStart);
  else if(a==='startRoutine'){const r=find('routines',id);if(r)session={rid:r.id,rows:r.exs.map(ex=>{const l=lastOf(ex);return{ex,kg:l?l.kg:0,sets:l?l.sets:4,reps:l?l.reps:10,prev:l?l.kg+' kg · '+l.sets+'×'+l.reps:'',done:false}})}}
  else if(a==='rowDone'){const r=session.rows[+v];r.done=!r.done}
  else if(a==='rest'){clearInterval(rest.timer);rest.end=+v?Date.now()+v*1000:0;if(+v)rest.timer=setInterval(()=>{const el=document.getElementById('restLbl'),l=Math.max(0,Math.ceil((rest.end-Date.now())/1000));if(el)el.textContent=l?'Descanso '+l+' s':'¡A por la siguiente serie!';if(!l){clearInterval(rest.timer);try{navigator.vibrate&&navigator.vibrate(300)}catch(err){}}},250)}
  else if(a==='endSession'){const rows=session.rows.some(r=>r.done)?session.rows.filter(r=>r.done):session.rows;rows.forEach(r=>S.gym.push({id:uid(),ex:r.ex,kg:+r.kg,sets:+r.sets,reps:+r.reps,date:TODAY}));S.example=false;session=null;clearInterval(rest.timer);rest.end=0;save();render();showToast('Sesión guardada · '+rows.length+' ejercicios');return}
  else if(a==='cancelSession'){session=null;clearInterval(rest.timer);rest.end=0}
  else if(a==='toggleDone')showDone=!showDone;
  else if(a==='calNav'){const[y,m]=calMonth.split('-').map(Number),d=new Date(y,m-1+Number(v),1);calMonth=ymd(d).slice(0,7)}
  else if(a==='calSel')calSel=v;
  else if(a==='clearExample')clearExample();
  else if(a==='payDebt'){const d=find('debts',id);if(d){d.paid=true;S.moves.push({id:uid(),type:d.dir==='meDeben'?'ingreso':'gasto',amount:d.amount,concept:(d.dir==='meDeben'?'Devuelto por ':'Pagado a ')+d.person+' · '+d.concept,cat:'Deudas',date:TODAY})}}
  else if(a==='payLesson'){const l=find('lessons',id);if(l){l.paid=!l.paid;const s=stu(l.sid);
    if(l.paid)S.moves.push({id:uid(),lid:l.id,type:'ingreso',amount:s.price,concept:'Clase '+s.name,cat:'Clases',date:TODAY});else S.moves=S.moves.filter(m=>m.lid!==l.id)}}
  else if(a==='del'){const k=b.dataset.k;if(pendingDel===k+id){const it=S[k].find(x=>x.id===id);if(it&&it.rk)S.skip.push(it.rk);S[k]=S[k].filter(x=>x.id!==id);if(k==='recurring')['lessons','events','moves'].forEach(c=>{S[c]=S[c].filter(x=>!(x.rk&&x.rk.startsWith(id)&&x.date>TODAY))});if(k==='students'){S.lessons=S.lessons.filter(l=>l.sid!==id);S.exams=S.exams.filter(x=>x.sid!==id);S.sheets=S.sheets.filter(x=>x.sid!==id);selStu=null}pendingDel=null}else{pendingDel=k+id;render();return}}
  else if(a==='wipe'){if(pendingDel==='wipe'){S=EMPTY();pendingDel=null}else{pendingDel='wipe';render();return}}
  else if(a==='copy'){const ta=document.getElementById('bkOut'),m=document.getElementById('copyMsg');
    (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>m.textContent='Copiado.').catch(()=>{ta.select();m.textContent='Selecciona el texto y cópialo a mano.'});return}
  else if(a==='restore'){const m=document.getElementById('restoreMsg');try{const d=JSON.parse(document.getElementById('bkIn').value);if(!d.tasks||!d.moves)throw 0;S={...EMPTY(),...d};save();m.textContent='Datos restaurados.'}catch(err){m.textContent='Ese texto no es una copia válida. Pega la copia completa.'}return}
  save();render();
});

const BUILD={
  tasks:f=>({title:f.title.trim(),kind:f.kind,date:f.date,time:f.time||'',must:f.must==='1',done:false}),
  moves:f=>({type:f.type,amount:+f.amount,concept:f.concept.trim(),cat:f.cat,date:f.date||TODAY}),
  debts:f=>({dir:f.dir,person:f.person.trim(),amount:+f.amount,concept:f.concept.trim(),date:f.date||TODAY,paid:false}),
  gym:f=>({ex:f.ex.trim(),kg:+f.kg,sets:+f.sets,reps:+f.reps,date:f.date||TODAY}),
  runs:f=>{if(f.type==='series'){const repSec=toSec(f.repT),dist=+f.dist,reps=+f.reps;return{type:'series',reps,dist,repSec,rest:+f.rest||0,km:Math.round(reps*dist/100)/10,sec:repSec*reps,date:f.date||TODAY}}return{type:f.type,km:+f.km,sec:toSec(f.t,true),hr:+f.hr||0,date:f.date||TODAY}},
  meals:f=>({when:f.when,what:f.what.trim(),kcal:+f.kcal||0,p:+f.p||0,c:+f.c||0,f:+f.f||0,date:f.date||TODAY}),
  pots:f=>({name:f.name.trim(),target:+f.target||0,saved:0}),
  sleep:f=>({bed:f.bed,up:f.up,date:f.date||TODAY}),
  students:f=>({name:f.name.trim(),price:+f.price,color:f.color||SCOLS[S.students.length%SCOLS.length]}),
  lessons:f=>({sid:f.sid,subject:(f.subject||'').trim(),topic:f.topic.trim(),date:f.date||TODAY,time:f.time||'',paid:f.paid==='1'}),
  exams:f=>({sid:f.sid,subject:f.subject.trim(),date:f.date||TODAY,grade:(f.grade||'').trim()}),
  events:f=>({who:f.who,type:f.who==='Yo'?'Partido':f.type,date:f.date||TODAY,time:f.time||'',where:f.where.trim(),result:(f.result||'').trim()}),
  bdays:f=>({name:f.name.trim(),date:f.date}),
  wish:f=>({item:f.item.trim(),price:+f.price||0,pref:(f.pref||'').trim(),done:false}),
  notes:f=>({text:f.text.trim(),date:TODAY}),
  habits:f=>({name:f.name.trim()}),
  pains:f=>({zone:f.zone,level:+f.level,since:f.since||TODAY,note:(f.note||'').trim(),resolved:''}),
  routines:f=>({name:f.name.trim(),exs:f.exs.split(',').map(s=>s.trim()).filter(Boolean)}),
  sheets:f=>({sid:f.sid,title:f.title.trim(),body:f.body.trim(),date:TODAY,ai:false}),
  alarms:f=>({time:f.time,label:(f.label||'').trim(),on:true})
};
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,fd=Object.fromEntries(new FormData(f)),k=f.dataset.form;if(e.submitter&&e.submitter.name)fd[e.submitter.name]=e.submitter.value;for(const q in fd)if(typeof fd[q]==='string'&&/^\s*-?\d+,\d+\s*$/.test(fd[q]))fd[q]=fd[q].trim().replace(',','.');
  if(k==='ai'){const q=(fd.q||'').trim();if(!q||aiBusy)return;askAI(q);return}
  if(k==='pinSet'){const pin=(fd.pin||'').trim();if(!/^\d{4}$/.test(pin)){showToast('El PIN tiene que ser de 4 cifras');return}sha(pin).then(h=>{setLock({pin:h});showToast(canBio()?'PIN guardado. Ahora puedes añadir Face ID.':'Bloqueo activado',3500);render()});return}
  if(k==='onboard'){const name=(fd.name||'').trim(),g={water:+fd.water||8,kcal:+fd.kcal||2400,km:+fd.km||30};if(fd.start!=='demo')clearExample();S.profile={name};S.goals={...S.goals,...g};try{localStorage.setItem('av.onb','1')}catch(e){}save();render();showToast(name?'¡Hola, '+name.split(' ')[0]+'!':'¡Listo!');return}
  if(k==='foodText'){const t=(fd.txt||'').trim();if(t&&!foodBusy)aiFood(t);return}
  if(k==='foodDraft'){S.meals.push({id:uid(),when:fd.when,what:(fd.what||'Comida').trim(),kcal:+fd.kcal||0,p:+fd.p||0,c:+fd.c||0,f:+fd.f||0,date:foodDraft?foodDraft.date:foodDay});foodDraft=null;save();render();showToast('Comida guardada');return}
  if(k==='quickMove'){const amt=parseFloat(String(fd.amount||'').replace(',','.'));if(!(amt>0)){showToast('Escribe primero el importe');return}const cat=fd.cat||'Otros';S.moves.push({id:uid(),type:qType,amount:Math.round(amt*100)/100,concept:(fd.concept||'').trim()||cat,cat,date:TODAY});S.example=false;save();render();showToast((qType==='gasto'?'Gasto':'Ingreso')+' de '+eur(amt)+' en '+cat);return}
  if(k==='moneyDraft'){const amt=parseFloat(String(fd.amount||'').replace(',','.'));if(amt>0){S.moves.push({id:uid(),type:'gasto',amount:Math.round(amt*100)/100,concept:(fd.concept||'Ticket').trim(),cat:fd.cat||'Otros',date:fd.date||TODAY});showToast('Gasto guardado')}moneyDraft=null;save();render();return}
  if(k==='budgets'){const b={};for(const[key,val]of Object.entries(fd))if(+val>0)b[key]=+val;S.budgets=b;save();render();showToast('Presupuestos guardados');return}
  if(k==='potAdd'){const x=find('pots',fd.id),amt=parseFloat(String(fd.amount||'').replace(',','.'));if(x&&amt>0){x.saved=Math.max(0,Math.round(((+x.saved||0)+amt*(+fd.dir||1))*100)/100);save();render();showToast(fd.dir==='-1'?'Sacado de la hucha':'Metido en la hucha')}return}
  if(k==='token'){try{localStorage.setItem('av.token',(fd.tok||'').trim())}catch(e){}aiOff=false;showToast('Clave guardada');return}
  if(k==='ctest'){addCTest(fd.fails);save();render();showToast(`Test apuntado · ${testsDone()} de ${TESTS_DAY} hoy`);return}
  if(k==='editItem'){const it=editing&&find(editing.k,editing.id);if(it){const old=it.name;
    editFields(editing.k,it).forEach(([n,,t])=>{let v=fd[n];if(v===undefined)return;if(t==='number')v=+v;else if(t==='bool')v=v==='1';else if(t==='dur'||t==='durs'){v=toSec(v,t==='dur');if(!(v>0))return}else v=String(v).trim();it[n]=v});
    if(editing.k==='runs'&&it.type==='series'){it.km=Math.round(it.reps*it.dist/100)/10;it.sec=it.repSec*it.reps}
    if(editing.k==='routines'&&old!==it.name)S.plan=S.plan.map(c=>c==='rt:'+old?'rt:'+it.name:c)}
    editing=null;save();render();showToast('Cambios guardados');return}
  if(k==='plan'){S.plan=[0,1,2,3,4,5,6].map(d=>fd['d'+d]||'');save();render();showToast('Plan guardado');return}
  if(k==='goals'){S.profile={...(S.profile||{}),name:(fd.name||'').trim()};S.goals={water:+fd.water||8,kcal:+fd.kcal||0,km:+fd.km||0,prot:+fd.prot||0,carb:+fd.carb||0,fat:+fd.fat||0};save();render();const m=document.getElementById('goalsMsg');if(m)m.textContent='Metas guardadas.';return}
  if(k==='runs'&&!(BUILD.runs(fd).sec>0)){showToast('Escribe el tiempo así: 28:30');return}
  if(k==='addEx'){const r=S.routines.find(x=>x.id===fd.rid);if(r&&fd.ex.trim())r.exs.push(fd.ex.trim());save();render();showToast('Ejercicio añadido');return}
  if(k==='stuNote'){const s=S.students.find(x=>x.id===fd.sid);if(s)s.note=fd.note;save();render();return}
  if(S.example){if(['lessons','exams','sheets','gym','runs','meals','pots','moves'].includes(k))S.example=false;else clearExample()}
  if(BUILD[k]){const item={id:uid(),...BUILD[k](fd)};S[k].push(item);if(fd.rep){const data=BUILD[k](fd);delete data.date;if(k==='lessons')data.paid=false;S.recurring.push({id:uid(),kind:k,freq:fd.rep,from:item.date,data});materialize()}if(k==='lessons'&&item.paid){const s=stu(item.sid);S.moves.push({id:uid(),lid:item.id,type:'ingreso',amount:s.price,concept:'Clase '+s.name,cat:'Clases',date:item.date})}}
  save();render();showToast(fd.rep?'Guardado. Se repetirá solo.':'Guardado');
});

function shareFile(name,type,content){const blob=new Blob([content],{type});let file=null;try{file=new File([blob],name,{type})}catch(err){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]}))navigator.share({files:[file],title:name}).catch(()=>{});
  else{const u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download=name;document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}}
